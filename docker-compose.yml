services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paywallet
      POSTGRES_USER: paywallet
      POSTGRES_PASSWORD: paywallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paywallet"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      retries: 12

  # Local AWS emulator (S3 and KMS); production uses the real services with no custom endpoint.
  s3:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3,kms
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      s3:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_URL: jdbc:postgresql://postgres:5432/paywallet
      REDIS_HOST: redis
      MONGO_URI: mongodb://mongo:27017/paywallet
      S3_ENDPOINT: http://s3:4566
      KMS_ENDPOINT: http://s3:4566
      # Presigned URLs must point to a host the client can reach.
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      # Development only: users may simulate deposits into their own wallet.
      ALLOW_SELF_DEPOSIT: "true"
      PIX_WEBHOOK_SECRET: dev-only-webhook-secret
      CARD_WEBHOOK_SECRET: dev-only-card-webhook-secret
      # Development only: encrypts gift card codes at rest.
      VOUCHER_KEY: mVA0yS2utY5uFJAj5mDvHGqvZCT8bhlSXbz079HZL9o=
      PAYMENT_LINK_BASE_URL: https://localhost/pay/
      FORWARD_HEADERS_STRATEGY: framework
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Development only: HMAC key for the one-time codes sent by email.
      AUTH_CODE_PEPPER: dev-only-code-pepper
      OTLP_TRACING_EXPORT_ENABLED: "true"
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # The API is only reachable through Caddy (HTTPS).
    ports:
      # Management port (health, metrics). Published for local development only; keep it private elsewhere.
      - "8081:8081"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - app
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports:
      - "80:80"
      - "443:443"

  # Local mailbox: every email the application sends shows up at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  tempo:
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.2
    depends_on:
      - prometheus
      - tempo
    environment:
      # Development only: dashboards open without login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  mongodata:
  caddydata:
