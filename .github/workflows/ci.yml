name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests start Postgres, Redis, MongoDB, Kafka and LocalStack through Testcontainers,
      # using the Docker engine available on GitHub-hosted runners.
      - name: Run tests
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  apps:
    name: Web and mobile apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace @paywallet/core
      - run: npm test --workspace @paywallet/core
      - run: npm run lint --workspace frontend
      - run: npm run typecheck --workspace frontend
      - run: npm test --workspace frontend
      - run: npm run build --workspace frontend
      - run: npm run typecheck --workspace mobile
      - run: npm run doctor --workspace mobile
      - run: npm run bundle --workspace mobile
