name: Container and chart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Chart lint and schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint
        run: |
          helm lint deploy/helm/paywallet
          helm lint deploy/helm/paywallet -f deploy/kind/values-kind.yaml

      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          for values in "" "-f deploy/kind/values-kind.yaml"; do
            helm template paywallet deploy/helm/paywallet $values \
                --set ingress.enabled=true,ingress.tlsSecretName=api-tls,serviceMonitor.enabled=true \
              | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.32.0
          done

  image:
    name: Image build and scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: paywallet
            context: .
          - image: paywallet-web
            context: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Fails on critical vulnerabilities that already have a fix available.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:ci" "$image:${GITHUB_SHA::12}"
          docker tag "$IMAGE:ci" "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"

  kind:
    name: Deploy to kind
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - uses: helm/kind-action@v1
        with:
          cluster_name: paywallet

      - name: Deploy and run the smoke test
        run: ./deploy/kind/up.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n paywallet get pods -o wide
          kubectl -n paywallet describe pods -l app.kubernetes.io/name=paywallet
          kubectl -n paywallet logs -l app.kubernetes.io/name=paywallet --tail=200 --all-containers
