spring:
  application:
    name: paywallet

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paywallet}
    username: ${DB_USER:paywallet}
    password: ${DB_PASSWORD:paywallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/paywallet}
      uuid-representation: standard
      auto-index-creation: true
    web:
      pageable:
        serialization-mode: via_dto

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  # Finishes in-flight requests before stopping (rolling updates, scale-in).
  shutdown: graceful
  # "native" behind a TLS-terminating proxy: Tomcat takes the client address and scheme from X-Forwarded-For and
  # X-Forwarded-Proto, and only when they come from a private-network proxy. Avoid "framework": it also honors the
  # RFC 7239 Forwarded header, which proxies pass through untouched, so clients could pick their own address and
  # dodge the per-IP limits.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  legal:
    # Recorded with each sign-up; bump it when the terms of use or the privacy policy change.
    terms-version: ${TERMS_VERSION:2026-09-28}
  openapi:
    # "/api" when the API is served behind the web app's proxy.
    server-url: ${API_SERVER_URL:/}
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://api.paywallet.local}
      audience: paywallet-api
      access-token-ttl: 15m
      # RSA PKCS#8 PEM. Empty = ephemeral key, development only.
      private-key: ${JWT_PRIVATE_KEY:}
    refresh-token-ttl: 30d
    login-max-attempts: 5
    login-lock-duration: 15m
    allow-self-deposit: ${ALLOW_SELF_DEPOSIT:false}
    codes:
      ttl: 15m
      max-attempts: 5
      resend-cooldown: 60s
      max-sends-per-hour: 5
      # HMAC key for one-time codes. Empty = ephemeral key, development only.
      pepper: ${AUTH_CODE_PEPPER:}
    pin:
      max-attempts: 5
      lock-duration: 30m
    mfa:
      issuer: PayWallet
      challenge-ttl: 5m
    ip-rate-limit: ${AUTH_IP_RATE_LIMIT:30}
    # Browser origins allowed to call the API directly (comma separated). Empty in normal deployments: the web app
    # reaches the API through its own proxy and mobile apps are not subject to CORS.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM:PayWallet <no-reply@paywallet.local>}
  external:
    authorizer-url: ${AUTHORIZER_URL:https://util.devi.tools/api/v2/authorize}
    notifier-url: ${NOTIFIER_URL:https://util.devi.tools/api/v1/notify}
    connect-timeout: 2s
    read-timeout: 3s
  outbox:
    poll-interval: 500ms
    batch-size: 100
    send-timeout: 10s
    retention: 7d
  pix:
    gateway: ${PIX_GATEWAY:simulated}
    ispb: ${PIX_ISPB:99999998}
    institution-name: PayWallet
    merchant-city: SAO PAULO
    settlement-interval: 500ms
    webhook-secret: ${PIX_WEBHOOK_SECRET:}
    webhook-tolerance: 5m
    lookups-per-minute: 30
    max-keys-individual: 5
    max-keys-merchant: 20
  credit:
    bureau: ${CREDIT_BUREAU:simulated}
    collection-enabled: ${LOAN_COLLECTION_ENABLED:true}
    analysis-validity: 30d
    min-amount: 100.00
    min-installments: 3
    max-installments: 24
    iof-flat-percent: 0.38
    iof-daily-percent: 0.0082
    late-fine-percent: 2
    late-monthly-interest-percent: 1
    zone: America/Sao_Paulo
  yield:
    enabled: ${YIELD_ENABLED:true}
    cdi-percentage: ${YIELD_CDI_PERCENTAGE:100}
    cdi-source: ${CDI_SOURCE:bcb}
    fixed-daily-rate: 0.055131
    bcb-series-url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados
    max-catch-up-days: 30
    zone: America/Sao_Paulo
  cards:
    processor: ${CARD_PROCESSOR:simulated}
    webhook-secret: ${CARD_WEBHOOK_SECRET:}
    webhook-tolerance: 5m
    revolving-monthly-percent: 9.99
    installment-monthly-percent: 8.99
    minimum-payment-percent: 15
    due-days-after-closing: 10
    statement-job-enabled: ${CARD_STATEMENT_JOB_ENABLED:true}
    zone: America/Sao_Paulo
  fraud:
    review-score: 50
    decline-score: 80
    velocity-window: 10m
    velocity-max-count: 5
    amount-anomaly-multiplier: 5
    amount-anomaly-min-history: 3
    amount-anomaly-floor: 500.00
    new-counterparty-amount: 1000.00
    night-start-hour: 22
    night-end-hour: 6
    night-amount: 1000.00
    new-account-days: 7
    new-account-amount: 500.00
    card-declines-window: 10m
    card-declines-max: 3
    zone: America/Sao_Paulo
  marketplace:
    provider: ${MARKETPLACE_PROVIDER:simulated}
    fulfillment-interval: 1s
    voucher-key: ${VOUCHER_KEY:}
    zone: America/Sao_Paulo
  bill:
    gateway: ${BILL_GATEWAY:simulated}
    settlement-interval: 1s
  merchant:
    wallet-fee-bps: 199
    pix-fee-bps: 99
    payment-link-base-url: ${PAYMENT_LINK_BASE_URL:http://localhost:8080/pay/}
    default-charge-ttl: 30m
    max-charge-ttl: 24h
    zone: America/Sao_Paulo
  limits:
    daily-transfer: ${DAILY_TRANSFER_LIMIT:5000.00}
    zone: America/Sao_Paulo
  crypto:
    kms-endpoint: ${KMS_ENDPOINT:http://localhost:4566}
    region: ${KMS_REGION:us-east-1}
    access-key: ${KMS_ACCESS_KEY:test}
    secret-key: ${KMS_SECRET_KEY:test}
    master-key-alias: ${KMS_MASTER_KEY_ALIAS:alias/paywallet-pii}
    create-master-key: ${KMS_CREATE_MASTER_KEY:true}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:paywallet-private}
    access-key: ${S3_ACCESS_KEY:test}
    secret-key: ${S3_SECRET_KEY:test}
    server-side-encryption: ${S3_SSE:}
    kms-key-id: ${S3_KMS_KEY_ID:}
    create-bucket: ${S3_CREATE_BUCKET:true}
    presign-ttl: 5m
    max-upload-bytes: 10485760

management:
  # Kept off the public API port: metrics reveal business volumes.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for Kubernetes probes.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: paywallet
    distribution:
      percentiles-histogram:
        http.server.requests: true
        paywallet.partner.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:false}
