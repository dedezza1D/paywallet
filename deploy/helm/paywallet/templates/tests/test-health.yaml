apiVersion: v1
kind: Pod
metadata:
  name: {{ include "paywallet.fullname" . }}-test-health
  # Not the app's selector labels: the Service, PDB and HPA would count this pod as a replica (the HPA stops scaling
  # because the pod has no CPU request).
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: curlimages/curl:8.15.0
      command:
        - sh
        - -c
        - >-
          curl -fsS http://{{ include "paywallet.fullname" . }}:{{ .Values.service.managementPort }}/actuator/health/readiness
          && curl -fsS http://{{ include "paywallet.fullname" . }}:{{ .Values.service.port }}/.well-known/jwks.json > /dev/null
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
