{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "paywallet.fullname" . }}
  labels:
    {{- include "paywallet.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The web app serves the site and proxies /api; without it the API is exposed directly. The management
          # port stays inside the cluster either way.
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.web.enabled }}
                name: {{ include "paywallet.web.fullname" . }}
                {{- else }}
                name: {{ include "paywallet.fullname" . }}
                {{- end }}
                port:
                  name: http
{{- end }}
