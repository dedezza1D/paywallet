{{- if .Values.networkPolicy.enabled }}
# Only inbound traffic is restricted: the application talks to many managed services (database, Kafka, AWS,
# partners) whose addresses are outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paywallet.fullname" . }}
  labels:
    {{- include "paywallet.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paywallet.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.apiFromNamespaces }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
    - ports:
        - port: management
      from:
        {{- range .Values.networkPolicy.managementFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        # The chart's own test pod.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
{{- end }}
